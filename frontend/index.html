<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">

<style>
/* =====================================================
   SISTEMA HOSPITALAR — TEMA PREMIUM / LUXO
   ===================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;

  font-family: "Segoe UI", Arial, Helvetica, sans-serif;

  background:
    radial-gradient(circle at 20% 20%, rgba(0, 188, 212, 0.12), transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(30, 136, 229, 0.12), transparent 30%),
    linear-gradient(135deg, #06121f 0%, #0b1f33 50%, #071421 100%);

  color: #172b3a;
  overflow: hidden;
}

/* Efeito decorativo no fundo */
body::before {
  content: "";
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;

  background: rgba(0, 188, 212, 0.06);
  filter: blur(80px);

  top: -200px;
  left: -150px;

  pointer-events: none;
}

body::after {
  content: "";
  position: fixed;
  width: 450px;
  height: 450px;
  border-radius: 50%;

  background: rgba(30, 136, 229, 0.07);
  filter: blur(90px);

  bottom: -200px;
  right: -150px;

  pointer-events: none;
}

/* =====================================================
   CARD PRINCIPAL
   ===================================================== */

.container {
  position: relative;
  width: 410px;
  max-width: calc(100% - 40px);

  padding: 45px 42px 42px;

  background: rgba(255, 255, 255, 0.97);

  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 22px;

  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.35),
    0 10px 30px rgba(0, 0, 0, 0.15);

  text-align: center;

  backdrop-filter: blur(15px);

  animation: aparecer 0.6s ease-out;
}

/* Linha superior elegante */
.container::before {
  content: "";
  position: absolute;

  top: 0;
  left: 50%;
  transform: translateX(-50%);

  width: 90px;
  height: 4px;

  background: linear-gradient(
    90deg,
    #00acc1,
    #26c6da,
    #1976d2
  );

  border-radius: 0 0 10px 10px;
}

/* =====================================================
   TÍTULO
   ===================================================== */

.container h2 {
  margin-bottom: 32px;

  color: #102a43;

  font-size: 25px;
  font-weight: 700;

  letter-spacing: -0.4px;
}

/* =====================================================
   CAMPOS
   ===================================================== */

.container input {
  width: 100%;
  height: 54px;

  margin-bottom: 16px;
  padding: 0 17px;

  border: 1px solid #d8e2ea;
  border-radius: 12px;

  background: #f7fafc;

  color: #17324d;

  font-size: 15px;

  outline: none;

  transition:
    border-color 0.25s ease,
    box-shadow 0.25s ease,
    background 0.25s ease,
    transform 0.25s ease;
}

.container input::placeholder {
  color: #8a9baa;
}

.container input:hover {
  background: #ffffff;
  border-color: #b9cad8;
}

.container input:focus {
  background: #ffffff;
  border-color: #18a8c5;

  box-shadow:
    0 0 0 4px rgba(24, 168, 197, 0.10),
    0 5px 15px rgba(24, 168, 197, 0.08);

  transform: translateY(-1px);
}

/* =====================================================
   BOTÃO
   ===================================================== */

.container button {
  width: 100%;
  height: 54px;

  margin-top: 8px;

  border: none;
  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #087f9c 0%,
      #0797b5 50%,
      #176fc1 100%
    );

  color: #ffffff;

  font-size: 15px;
  font-weight: 700;

  letter-spacing: 0.3px;

  cursor: pointer;

  box-shadow:
    0 10px 25px rgba(8, 127, 156, 0.25);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    filter 0.2s ease;
}

.container button:hover {
  transform: translateY(-2px);

  filter: brightness(1.08);

  box-shadow:
    0 14px 30px rgba(8, 127, 156, 0.35);
}

.container button:active {
  transform: translateY(0);

  box-shadow:
    0 6px 15px rgba(8, 127, 156, 0.25);
}

/* =====================================================
   ANIMAÇÃO
   ===================================================== */

@keyframes aparecer {
  from {
    opacity: 0;
    transform: translateY(20px) scale(0.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* =====================================================
   RESPONSIVIDADE
   ===================================================== */

@media (max-width: 500px) {

  body {
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 380px;

    padding: 38px 28px 32px;

    border-radius: 18px;
  }

  .container h2 {
    font-size: 22px;
    margin-bottom: 26px;
  }

  .container input,
  .container button {
    height: 52px;
  }
}
</style>

</head>

<body>
<div class="container">
  <h2>🏥 IAGUIN HOSPITAIS</h2>
  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<script>
function login() {
  fetch("/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      usuario: usuario.value,
      senha: senha.value
    })
  })
  .then(r => r.json())
  .then(data => {
    if(data.tipo === "triagem") location.href = "triagem.html";
    if(data.tipo === "medico") location.href = "medico.html";
    if(data.tipo === "atendimento") location.href = "atendimento.html";
  });
}
 
 
</script>
</body>
</html>
